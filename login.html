<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 로그인</title>
    <meta
      name="description"
      content="관리자 로그인 페이지"
    />
  </head>
  <body>
    <main class="app-shell login-page">
      <section class="panel login-panel">
        <h1>관리자 로그인</h1>

        <form id="login-form" class="login-form">
          <label for="email-input">이메일</label>
          <input id="email-input" type="email" placeholder="admin@example.com" required />

          <label for="password-input">비밀번호</label>
          <input id="password-input" type="password" placeholder="비밀번호를 입력하세요" required />

          <button class="primary-button" type="submit">로그인</button>
        </form>

        <div id="login-message" class="message-box" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>
